<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Osasuna Navy Blue gradient -->
    <linearGradient id="osasunaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b3d" />
      <stop offset="50%" stop-color="#0a1329" />
      <stop offset="100%" stop-color="#050a17" />
    </linearGradient>
    <!-- Osasuna Rojo Rojillo gradient -->
    <linearGradient id="osasunaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="35%" stop-color="#c8102e" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <!-- Crown Gold gradient -->
    <linearGradient id="osasunaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <!-- Shield shadow -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </feDropShadow>
  </defs>

  <!-- Background container in deep navy blue -->
  <rect width="512" height="512" rx="112" fill="url(#osasunaBlue)" />

  <!-- Subtle heraldic background rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1d3368" stroke-width="2" opacity="0.6" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#254286" stroke-width="1.5" opacity="0.4" />

  <!-- Osasuna Rojillo Heraldic Shield -->
  <g filter="url(#shieldShadow)">
    <!-- Outer gold trim of the shield -->
    <path d="M 256,90 L 370,135 C 370,270 320,360 256,410 C 192,360 142,270 142,135 Z"
          fill="none" stroke="url(#osasunaGold)" stroke-width="6" stroke-linejoin="round" />

    <!-- Red shield body -->
    <path d="M 256,96 L 362,139 C 362,266 315,351 256,400 C 197,351 150,266 150,139 Z"
          fill="url(#osasunaRed)" />
          
    <!-- Navy Blue interior diagonal sash / chevron -->
    <path d="M 256,180 L 320,225 L 320,290 L 256,335 L 192,290 L 192,225 Z"
          fill="#0a1329" stroke="url(#osasunaGold)" stroke-width="3" opacity="0.95" />
  </g>

  <!-- Crown on top of shield (Reyno / Navarra heritage) -->
  <g transform="translate(196, 50)">
    <path d="M 10,38 L 22,14 L 40,28 L 60,8 L 80,28 L 98,14 L 110,38 Z"
          fill="url(#osasunaGold)" stroke="#78350f" stroke-width="2" />
    <circle cx="22" cy="12" r="4" fill="#fef08a" />
    <circle cx="60" cy="6" r="5" fill="#fef08a" />
    <circle cx="98" cy="12" r="4" fill="#fef08a" />
    <rect x="10" y="38" width="100" height="7" rx="3" fill="url(#osasunaGold)" />
  </g>

  <!-- Central monogram: CE (Club de Empresas) & networking node -->
  <text x="256" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="-1">CE</text>
  
  <!-- Subtle networking nodes -->
  <circle cx="216" cy="225" r="4" fill="#f59e0b" />
  <circle cx="296" cy="225" r="4" fill="#f59e0b" />
  <circle cx="256" cy="335" r="4" fill="#f59e0b" />

  <!-- Subtitle pill at bottom -->
  <rect x="176" y="440" width="160" height="28" rx="14" fill="#0c1836" stroke="#1e3a78" stroke-width="2" />
  <text x="256" y="459" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">ROJILLO B2B</text>
</svg>
